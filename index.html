<!DOCTYPE html>
<html lang="es-US" data-bs-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceBook</title>
  <link rel="manifest" href="res/webmanifest.json">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons.min.css">
  <style>
    /* Evita el efecto de "rebote" (pull-to-refresh) al deslizar en móviles, logrando una sensación de aplicación nativa.*/
    html, body { overscroll-behavior-y: contain; }

    @font-face {
      font-family: 'JetBrainsMono Regular';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('lib/fonts/JetBrainsMono-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'JetBrainsMono Bold';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('lib/fonts/JetBrainsMono-Bold.woff2') format('woff2');
    }

    #priceTable th { background-color: var(--bs-secondary-bg); vertical-align: middle; }
    #priceTable th, #priceTable td { text-align: center; }
    #priceTable th:first-child, #priceTable td:first-child { text-align: start; }
    #priceTable td:nth-child(2), #priceTable td:nth-child(3) {
      font-family: 'JetBrainsMono Regular', monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 400; /* Un peso mediano para distinguir las cifras del texto general */
    }
    #priceTable td:nth-child(3) { color: var(--bs-info-text-emphasis); }
    #priceTable td small { color: var(--bs-secondary-color); }
  </style>
</head>
<!-- user-select-none: Evita selecciones accidentales de texto mientras el usuario interactúa o desplaza en pantallas táctiles, al mismo tiempo que se logra una sensación de aplicación nativa.-->
<body class="user-select-none">
  <header><!-- El encabezado se agregará en el futuro. --></header>
  <main class="container-sm px-2">
    <section aria-label="Controles para la tabla de precios" class="bg-body mb-4 sticky-top shadow-sm">
      <search class="row g-2">
        <div class="col-12 col-sm-6 order-2 order-sm-1 my-2 d-flex justify-content-center">
          <div class="input-group w-auto">
            <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
            <input type="text" enterkeyhint="search" id="inTableSearchInput" class="form-control" maxlength="20" style="box-sizing: content-box !important; max-width: 20ch;" placeholder="Buscar precios de ..." aria-label="Buscar precios de ...">
            <button class="btn btn-outline-secondary d-none" type="button" id="clearInTableSearchBtn" aria-label="Borrar la búsqueda"><i class="bi bi-x-circle-fill" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="col-12 col-sm-6 order-1 order-sm-2 my-2 d-flex justify-content-center">
          <div class="input-group w-auto">
            <label for="exchangeRateInput" class="input-group-text"><i aria-hidden="true" class="bi bi-currency-exchange text-success mx-1"></i>Tasa Bs →</label>
            <input type="text" inputmode="decimal" enterkeyhint="done" id="exchangeRateInput" class="form-control text-end" style="transition: color 0.25s ease; box-sizing: content-box !important; font-family: 'JetBrainsMono Bold', monospace; font-variant-numeric: tabular-nums; " placeholder="0.00" value="">
            <button class="btn btn-outline-secondary d-none" type="button" id="clearExchangeRateBtn" aria-label="Borrar la tasa"><i class="bi bi-x-circle-fill" aria-hidden="true"></i></button>
          </div>
        </div>
      </search>
    </section>
    <section aria-label="La tabla de precios">
      <table id="priceTable" class="table table-hover table-striped align-middle">
        <thead>
          <tr>
            <!-- scope="col" mejora la accesibilidad de la tabla, indicando que estas celdas son encabezados de columna. -->
            <th scope="col">Producto</th>
            <!-- El encabezado del precio base puede cambiar dinámicamente para indicar la moneda original cuando se muestra la conversión. -->
            <th scope="col" id="basePriceHeader">Precio</th>
            <!-- La columna de precio convertido se oculta inicialmente porque solo debe mostrarse cuando existe una tasa de cambio válida. -->
            <th scope="col" id="convertedPriceHeader" class="d-none">Precio<br>Bs</th>
          </tr>
        </thead>
        <tbody id="priceTableBody" class="table-group-divider"><!-- Se genera dinamicamente --></tbody>
      </table>
    </section>
  </main>

  <script>
    const products = [];
    // Mapeo básico de sanitización para mitigar riesgos de ataques XSS al insertar cadenas mediante innerHTML
    const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
    // lastHideConversionState se usa como memoria del último estado de visibilidad de la columna convertida. Esto evita modificar el DOM innecesariamente si la condición de ocultar/mostrar no cambió.
    let lastHideConversionState = true;
    // Temporizador para aplicar debounce a los eventos de entrada. El debounce evita volver a renderizar la tabla en cada pulsación, mejorando el rendimiento y reduciendo parpadeo visual.
    let debounceTimer;

    const exchangeRateInput = document.getElementById('exchangeRateInput');
    const clearExchangeRateBtn = document.getElementById('clearExchangeRateBtn');
    const inTableSearchInput = document.getElementById('inTableSearchInput');
    const clearInTableSearchBtn = document.getElementById('clearInTableSearchBtn');
    const priceTableBody = document.getElementById('priceTableBody');
    const basePriceHeader = document.getElementById('basePriceHeader');
    const convertedPriceHeader = document.getElementById('convertedPriceHeader');

    // Detecta y sincroniza automáticamente el tema (oscuro/claro) según las preferencias del sistema operativo
    const syncThemeWithOS = () => document.documentElement.setAttribute('data-bs-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    syncThemeWithOS();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeWithOS);

    // Mock de datos en formato NDJSON (Newline Delimited JSON) que permite procesamiento en streaming línea por línea
    const mockNdjsonProducts = '{"name":"Arroz (1 kg)","basePrice":1.20}\n{"name":"Leche entera (1 L)","basePrice":0.95}\n{"name":"Café en grano (250g)","basePrice":3.50}\n{"name":"Aceite de Oliva (500ml)","basePrice":6.80}\n{"name":"Harina de Trigo (1 kg)","basePrice":1.10}\n{"name":"Pan de molde","basePrice":1.50}\n{"name":"Azúcar refinada (1 kg)","basePrice":1.15}\n{"name":"Sal de mesa (1 kg)","basePrice":0.60}\n{"name":"Pasta corta (500g)","basePrice":0.90}\n{"name":"Atún en lata (140g)","basePrice":1.75}\n{"name":"Sardinas en lata","basePrice":1.10}\n{"name":"Mantequilla (500g)","basePrice":2.30}\n{"name":"Queso blanco (1 kg)","basePrice":5.50}\n{"name":"Jamón pierna (1 kg)","basePrice":6.00}\n{"name":"Huevos (cartón de 30)","basePrice":4.20}\n{"name":"Pollo entero (1 kg)","basePrice":2.80}\n{"name":"Carne de res (1 kg)","basePrice":7.50}\n{"name":"Chuleta de cerdo (1 kg)","basePrice":5.20}\n{"name":"Tomate (1 kg)","basePrice":1.80}\n{"name":"Cebolla (1 kg)","basePrice":1.50}\n{"name":"Papa (1 kg)","basePrice":1.40}\n{"name":"Zanahoria (1 kg)","basePrice":1.30}\n{"name":"Pimentón (1 kg)","basePrice":2.20}\n{"name":"Lechuga","basePrice":0.80}\n{"name":"Manzana (1 kg)","basePrice":3.00}\n{"name":"Banana (1 kg)","basePrice":1.10}\n{"name":"Naranja (1 kg)","basePrice":1.50}\n{"name":"Durazno (1 kg)","basePrice":3.50}\n{"name":"Fresa (250g)","basePrice":2.00}\n{"name":"Yogurt batido (1 L)","basePrice":2.50}\n{"name":"Crema de leche (200ml)","basePrice":1.60}\n{"name":"Mayonesa (500g)","basePrice":2.40}\n{"name":"Ketchup (400g)","basePrice":2.10}\n{"name":"Mostaza (250g)","basePrice":1.50}\n{"name":"Vinagre (500ml)","basePrice":0.90}\n{"name":"Salsa de soya (200ml)","basePrice":1.80}\n{"name":"Avena en hojuelas (500g)","basePrice":1.60}\n{"name":"Cereal de maíz (300g)","basePrice":3.20}\n{"name":"Galletas María","basePrice":1.00}\n{"name":"Chocolate oscuro (100g)","basePrice":2.20}\n{"name":"Agua mineral (1.5 L)","basePrice":0.70}\n{"name":"Refresco cola (2 L)","basePrice":2.00}\n{"name":"Jugo de naranja envasado","basePrice":2.30}\n{"name":"Cerveza (lata)","basePrice":1.25}\n{"name":"Detergente en polvo (1 kg)","basePrice":3.80}\n{"name":"Jabón de baño (barra)","basePrice":0.90}\n{"name":"Papel higiénico (4 rollos)","basePrice":2.50}\n{"name":"Cloro líquido (1 L)","basePrice":1.00}\n{"name":"Lavaplatos en crema","basePrice":1.40}\n{"name":"Esponja de cocina","basePrice":0.50}';

    // Función de sanitización XSS
    const escapeHtml = (str) => str.replace(/[&<>]/g, char => ESCAPE_MAP[char]);
    const optimizeForSearch = (str) => str.trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    /**
     * Generador asíncrono para procesar el stream de datos NDJSON incrementalmente.
     * Aquí utilizamos este enfoque debido a que nos permite llenar un array con los datos sin necesidad de poner todo el archivo en una variable de texto.
     */
    async function* parseNdjsonStream(stream) {
      const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split('\n');
        // Conserva el último elemento incompleto en el buffer para la siguiente lectura
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          // Se ignoran líneas vacías y se parsea cada objeto JSON individual.
          if (trimmed) yield JSON.parse(trimmed);
        }
      } // Al finalizar el stream, puede quedar una última línea sin salto de línea final. Si existe, también se procesa.
      if (buffer.trim()) yield JSON.parse(buffer.trim());
    }

    // Ordena alfabéticamente respetando caracteres locales, diferencias numéricas ("2" antes que "10") y sin distinguir acentos.
    const productCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    const amountFormatter = new Intl.NumberFormat(document.documentElement.lang || 'es-US', {
      style: 'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2
    });

    const loadProductsFromStream = async (stream) => {
      products.length = 0;// Se vacía el array existente en lugar de reasignarlo, porque products fue declarado como const y otras funciones usan esta misma referencia.

      for await (const product of parseNdjsonStream(stream)) {
        // OPTIMIZACIÓN: Precalcula `_searchName` y `_safeName` en minúsculas para evitar llamar a `.toLowerCase()` y `escapeHtml()` repetidamente por cada producto durante las búsquedas en tiempo real.
        products.push({ ...product, _searchName: optimizeForSearch(product.name), _safeName: escapeHtml(product.name), _formattedBasePrice: amountFormatter.format(product.basePrice) });
      }
      products.sort((a, b) => productCollator.compare(a.name, b.name));
      renderPriceTable();
    };

    // Renderiza la tabla de precios aplicando búsqueda y conversión monetaria. Se reconstruye el tbody en cada llamada.
    const renderPriceTable = () => {
      // Limpia caracteres no numéricos excepto el punto decimal
      const exchangeRate = getExchangeRate();
      const searchTerms = optimizeForSearch(inTableSearchInput.value).split(/\s+/).filter(Boolean);

      // Determina si se oculta la conversión (si la tasa es 0 o 1 es innecesario mostrarla)
      const shouldHideConversion = (exchangeRate === 0 || exchangeRate === 1);

      // OPTIMIZACIÓN DOM: Solo modifica los encabezados e interactúa con clases si el estado de visibilidad cambió
      if (lastHideConversionState !== shouldHideConversion) {
        basePriceHeader.innerHTML = shouldHideConversion ? 'Precio' : 'Precio<br>Base';
        convertedPriceHeader.classList.toggle('d-none', shouldHideConversion);
        lastHideConversionState = shouldHideConversion;
      }

      // Identifica tasas elevadas (ej. hiperinflacionarias) para dar formato visual diferencial a los precios convertidos, de modo que la parte decimal se muestre como menos importante que la parte entera.
      const isHighRate = exchangeRate >= 100;
      let rowsHtmlParts = [];
      let hasMatches = false;// permite saber si hubo resultados, para mostrar una fila informativa en caso contrario.

      for (const product of products) {
        if (searchTerms.length > 0 && !searchTerms.every(term => product._searchName.includes(term)) ) continue;
        hasMatches = true;
        rowsHtmlParts.push(`<tr><td>${product._safeName}</td><td>${product._formattedBasePrice}</td>`);
        if (!shouldHideConversion) {
          const parts = amountFormatter.formatToParts(product.basePrice * exchangeRate);
          // MEJORA VISUAL: En valores grandes, reduce el tamaño del separador decimal y centavos (`<small>`) para facilitar la lectura de la cifra entera.
          const displayPrice = parts.map(p => (isHighRate && (p.type === 'decimal' || p.type === 'fraction'))? `<small>${p.value}</small>`: p.value ).join('');
          rowsHtmlParts.push(`<td>${displayPrice}</td>`);
        }
        rowsHtmlParts.push("</tr>");
      }

      priceTableBody.innerHTML = hasMatches 
        ? rowsHtmlParts.join('')
        : `<tr aria-live="polite" aria-atomic="true"><td colspan="${shouldHideConversion ? 2 : 3}" class="text-center py-4"><i class="bi bi-inbox fs-3 d-block mb-1"></i>No se encontraron coincidencias</td></tr>`;
      rowsHtmlParts=null;
    };

    /**
     * Solución de experiencia de usuario (UX) para teclados móviles:
     * Al presionar "Enter" en cualquier campo, procesa inmediatamente la tabla sin esperar 
     * al debounce y oculta el teclado para despejar la pantalla del usuario.
     */
    const handleEnterKey = (e) => {
      if (e.key !== 'Enter' && e.keyCode !== 13) return false;
      e.preventDefault();
      clearTimeout(debounceTimer);
      renderPriceTable();
      // Desenfoca el elemento activo para ocultar el teclado virtual en dispositivos móviles.
      document.activeElement?.blur();
      return true;
    };

    /**
     * DEBOUNCE: Retarda la ejecución del renderizado 250ms mientras el usuario escribe,
     * reduciendo el consumo de CPU y evitando congelamientos por eventos continuos de entrada.
     */
    const handleDebouncedInput = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderPriceTable, 250);
    };

    const MAX_AMOUNT_DIGITS=8;
    exchangeRateInput.style.maxWidth = (MAX_AMOUNT_DIGITS+1)+"ch";
    const getExchangeRate = () => {
      const rate = parseFloat(exchangeRateInput.value);
      return isNaN(rate) ? 0 : rate;
    };
    const updateExchangeRateUI = () => {
      const isActive = getExchangeRate() > 0;
      exchangeRateInput.classList.toggle('text-success-emphasis', isActive);
      clearExchangeRateBtn.classList.toggle('d-none', !isActive);
      handleDebouncedInput();
    };
    let lastExchangeRateVal = '';
    exchangeRateInput.addEventListener('input', (e) => {
      const input = e.target;
      let val = input.value;
      const originalLength = val.length;
      const cursorPosition = input.selectionStart;
      // 1. Manejo de formatos internacionales (coma vs punto)
      if (val.includes(',') && val.includes('.')) {
        val = val.indexOf(',') < val.indexOf('.') 
          ? val.replace(/,/g, '') 
          : val.replace(/\./g, '').replace(',', '.');
      } else {
        val = val.replace(',', '.');
      }
      // 2. Limpieza de caracteres no numéricos
      val = val.replace(/[^0-9.]/g, '');
      // 3. Asegurar un único punto decimal
      const firstDot = val.indexOf('.');
      if (firstDot !== -1) {
        val = val.slice(0, firstDot + 1) + val.slice(firstDot + 1).replace(/\./g, '');
      }
      // 4. Restricción de dígitos (MAX_AMOUNT_DIGITS) optimizada
      if (firstDot !== -1) {
        const intPart = val.slice(0, firstDot);
        const decPart = val.slice(firstDot + 1);
        const trimmedInt = intPart.slice(0, MAX_AMOUNT_DIGITS);
        const availableForDec = MAX_AMOUNT_DIGITS - trimmedInt.length;
        const trimmedDec = decPart.slice(0, Math.max(0, availableForDec));
        val = trimmedInt + (availableForDec > 0 ? '.' + trimmedDec : '');
      } else {
        val = val.slice(0, MAX_AMOUNT_DIGITS);
      }
      // 5. Prevención del salto del cursor (Cursor Jumping)
      const newLength = val.length;
      const lengthDiff = originalLength - newLength;
      if (input.value !== val) {
        input.value = val;
        // Ajustar la posición del cursor basada en los caracteres eliminados antes de él
        const newCursorPosition = Math.max(0, cursorPosition - lengthDiff);
        input.setSelectionRange(newCursorPosition, newCursorPosition);
      }
      // 6. Actualización condicional de UI
      if (val !== lastExchangeRateVal) {
        lastExchangeRateVal = val;
        updateExchangeRateUI();
      }
    });
    exchangeRateInput.addEventListener('keydown', handleEnterKey);
    exchangeRateInput.addEventListener('focus', () => exchangeRateInput.select());
    // Limpia ceros a la izquierda y puntos decimales al final cuando el campo pierde el foco (ej: "45." -> "45")
    exchangeRateInput.addEventListener('blur', () => {
      let val = exchangeRateInput.value;
      if (!val) return;
      // Normalización automática: parseFloat elimina ceros a la izquierda ("05" -> 5) y puntos decimales vacíos ("5." -> 5). toString() lo vuelve a string limpio.
      const num = parseFloat(val);
      if (!isNaN(num)) {
        val = num.toString();
      } else {
        val = ''; // Si por alguna razón quedó algo inválido, limpiar
      }
      if (exchangeRateInput.value !== val) {
        exchangeRateInput.value = val;
        lastExchangeRateVal = val;
        updateExchangeRateUI();
      }
    });
    clearExchangeRateBtn.addEventListener('click', () => {
      exchangeRateInput.value = lastExchangeRateVal = '';
      updateExchangeRateUI();
      exchangeRateInput.focus();
    });

    inTableSearchInput.addEventListener('keydown', handleEnterKey);
    inTableSearchInput.addEventListener('input', () => {
      clearInTableSearchBtn.classList.toggle('d-none', inTableSearchInput.value=='');
      handleDebouncedInput();
    });
    clearInTableSearchBtn.addEventListener('click', () => {
      inTableSearchInput.value='';
      clearInTableSearchBtn.classList.add('d-none');
      handleDebouncedInput();
      inTableSearchInput.focus();
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        inTableSearchInput.focus();
      }
    });

    // Simula una transmisión en vivo cargando la cadena mock como un ReadableStream de red
    loadProductsFromStream(new Blob([mockNdjsonProducts]).stream());
  </script>
</body>
</html>
